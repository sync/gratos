name: release

# The Changesets flow (docs/plan.html F7, AGENTS.md "Releasing"), in three jobs, so that only the
# job that publishes can mint an npm token, and so that it publishes the immutable artifact the
# tests passed, packed before any test ran.
#
#   release  (contents: write, pull-requests: write; no id-token)
#     changesets/action/select-mode decides what this push to main is for:
#       version  changesets are pending: changesets/action/version opens or updates the Version
#                Packages PR;
#       publish  no changeset is pending, and the registry lacks a version (select-mode runs
#                `changeset publish-plan` to find out): only when the repo variable
#                GRATOS_PUBLISH is exactly "true", `pnpm run release:pack` (scripts/release.ts
#                --pack-only) plans again and packs that plan with `changeset pack`. Right
#                after, the job records the plan's sha256 as a job output, and uploads the pack
#                dir as an artifact, whose id is a job output too. It runs no gate and no test:
#                nothing runs between the pack and the upload;
#       none     nothing to do, and nothing runs: no gate on a push with nothing to publish.
#   test     (contents: read; only when release uploaded a pack)
#     runs the gate (`pnpm check` and `vendor:verify`), then downloads the artifact by its id,
#     checks it against the recorded plan sha256 (scripts/verify-pack.ts), and runs the install
#     test (min, newest, core) on it. Nothing it runs can change what publish gets: an
#     upload-artifact v4 artifact is immutable once uploaded ("They cannot be altered by
#     subsequent jobs unless the Artifacts are deleted and recreated (where they will have a new
#     ID)", actions/upload-artifact v4 README, "v4 - What's new"), and download-artifact v4, given
#     `artifact-ids`, downloads that id only, and fails when it no longer exists (its
#     src/download-artifact.ts: "None of the provided artifact IDs were found"). So a step that
#     deletes the artifact and uploads another under the same name makes publish fail, not
#     publish something else.
#   publish  (id-token: write, contents: write; only when release uploaded a pack and test passed)
#     downloads the same artifact by its id, checks it again (verify-pack: the plan's sha256 from
#     the release job, then every tarball's integrity, package and version), and publishes exactly
#     those tarballs with `changeset publish --from-pack-dir`, over npm trusted publishing (OIDC)
#     with provenance, through changesets/action/publish, which then pushes the tags and creates
#     the GitHub releases through the API. It runs no gate, no install test, and no dependency's
#     code beyond a frozen install with --ignore-scripts and the Changesets CLI that publishes. No
#     npm token exists anywhere.
#
# Repo setup this needs (AGENTS.md "Releasing"): Settings > Actions > General > Workflow
# permissions > "Allow GitHub Actions to create and approve pull requests", or the version step
# cannot open its PR; and, for publishing, an npm trusted publisher for release.yml on both
# packages that allows direct publishing (`npm publish`), not only staged publishing.
#
# The action opens and updates the Version Packages PR with GITHUB_TOKEN, so GitHub creates that
# PR's `ci` runs (pull_request) in an approval-required state instead of starting them: a
# maintainer starts them with "Approve workflows to run" in the PR's merge box, and they report
# the required `ci` check. A `workflow_dispatch` run would not: GitHub never counts a check from
# one toward a PR's required checks.
on:
  push:
    branches: [main]

# One release run at a time, never cancelled: a run cancelled between its jobs would leave a pack
# untested or unpublished, and one cancelled while publishing, a partial release.
concurrency: ${{ github.workflow }}-${{ github.ref }}

# Each job states its own.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the Version Packages branch
      pull-requests: write # the Version Packages PR
    outputs:
      pack-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      plan-sha256: ${{ steps.packed.outputs.plan-sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The version sub-action commits and pushes through the GitHub API, so the token is
          # not left in .git/config for the pack's prepack scripts to read.
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      # No `cache: pnpm`, and no turbo cache, in any job, on purpose: the Actions cache is
      # writable from lower-privileged runs, and these jobs build, test and publish with
      # provenance. They install from the registry, checked against the lockfile, and run from
      # scratch.
      #
      # Unlike shadcn-ui/cn's release workflow, there is no npm 11 pin and no `registry-url`:
      # pnpm 12 runs `info`, `pack` and `publish` itself, and does the OIDC token exchange with
      # the registry itself, so npm and an .npmrc written by setup-node play no part.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Select the mode
        id: mode
        uses: changesets/action/select-mode@v2
      - name: Open or update the Version Packages PR
        if: steps.mode.outputs.mode == 'version'
        uses: changesets/action/version@v2
        with:
          # The default, "Version Packages", does not match the repo's conventional-commit
          # history.
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
      # Publishing is off until the maintainer sets the repo variable GRATOS_PUBLISH to "true",
      # after the first release, published by hand (AGENTS.md "Releasing"). The comparison is
      # made in the shell, because an expression's `==`, and contains(), ignore case: there,
      # "TRUE" would turn publishing on too.
      - name: Check that publishing is on
        id: publishing
        if: steps.mode.outputs.mode == 'publish'
        env:
          GRATOS_PUBLISH: ${{ vars.GRATOS_PUBLISH }}
        run: |
          if [ "$GRATOS_PUBLISH" = "true" ]; then
            echo "on=yes" >> "$GITHUB_OUTPUT"
          else
            echo "GRATOS_PUBLISH is not \"true\": the registry lacks a version, and nothing is published."
            echo "on=no" >> "$GITHUB_OUTPUT"
          fi
      # The plan and the pack only: the gate and the install test run in the test job, on the
      # artifact this job uploads, never before the upload.
      - name: Plan and pack the release
        if: steps.publishing.outputs.on == 'yes'
        run: pnpm run release:pack
      # scripts/release.ts leaves no .pack when the plan, made again, publishes nothing. The
      # sha256 is taken right after the pack, before anything else runs.
      - name: Record the packed plan
        id: packed
        if: steps.publishing.outputs.on == 'yes'
        run: |
          if [ -f .pack/publish-plan.json ]; then
            echo "plan-sha256=$(sha256sum .pack/publish-plan.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the pack
        id: upload
        if: steps.packed.outputs.plan-sha256 != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-pack
          path: .pack
          # .pack is a dot directory, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  test:
    needs: release
    if: needs.release.outputs.pack-artifact-id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # Before the download, so the gate (oxfmt and oxlint on `.`) never reads .pack.
      - name: Gate
        run: pnpm run release:gate
        env:
          # For `vendor:verify` only; no other step gets it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Whatever this job does to its own copy, the publish job downloads the artifact again,
      # by id: an upload-artifact v4 artifact is immutable (see the top of this file).
      - name: Download the pack
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release.outputs.pack-artifact-id }}
          path: .pack
          # Into .pack itself, not .pack/release-pack/.
          merge-multiple: true
      - name: Check the pack against the plan the release job packed
        run: node scripts/verify-pack.ts .pack --plan-sha256 "$PLAN_SHA256"
        env:
          PLAN_SHA256: ${{ needs.release.outputs.plan-sha256 }}
      - name: Install test (min, newest, core)
        run: pnpm run release:test

  publish:
    needs: [release, test]
    if: needs.release.outputs.pack-artifact-id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release tags and GitHub releases, through the API
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # The Changesets CLI that publishes, and nothing else runs: no lifecycle script.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the tested pack
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release.outputs.pack-artifact-id }}
          path: .pack
          # Into .pack itself, not .pack/release-pack/.
          merge-multiple: true
      - name: Check the pack against the plan the release job packed
        run: node scripts/verify-pack.ts .pack --plan-sha256 "$PLAN_SHA256"
        env:
          PLAN_SHA256: ${{ needs.release.outputs.plan-sha256 }}
      - name: Publish the tested tarballs
        id: publish
        uses: changesets/action/publish@v2
        with:
          # `changeset publish --from-pack-dir .pack`: it publishes the tarballs the plan names,
          # and writes the CHANGESETS_OUTPUT file from which the action pushes the tags (on this
          # commit, the one the tarballs were packed from) and creates the GitHub releases.
          script: pnpm run release:publish
          # The releases are created below, by a step that first checks each tag. The action
          # would create a release even after a failed tag push, without a target commit, and
          # GitHub would then tag whatever main is by then.
          create-github-releases: false
          push-git-tags: true
        env:
          # pnpm 12 reads its settings from PNPM_CONFIG_*, and ignores NPM_CONFIG_PROVENANCE, so
          # provenance is asked for under pnpm's own name.
          PNPM_CONFIG_PROVENANCE: "true"
      - name: Create the GitHub releases, from tags on this commit only
        # Also after the publish step failed: a partial publish (one package out, then a failure)
        # still pushes the published package's tag and sets `published`, and a later run's plan
        # leaves that version out, so its release must be created here.
        if: ${{ !cancelled() && steps.publish.outputs.published == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.publish.outputs.published-packages }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node -e 'for (const { name, version } of JSON.parse(process.env.PUBLISHED)) console.log(`${name} ${version}`)' |
            while read -r name version; do
              tag="$name@$version"
              # The commit the remote tag names (a lightweight tag, or an annotated one peeled).
              remote=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" | awk '{ print $1 }' | tail -n 1)
              if [ "$remote" != "$SHA" ]; then
                echo "::error::$tag is at '${remote:-missing}', not $SHA: no release is created for it"
                exit 1
              fi
              notes=$(awk -v v="$version" '/^## /{ if (found) exit; found = ($2 == v); next } found' "packages/$name/CHANGELOG.md")
              # A prerelease version (0.2.0-beta.0) is a GitHub prerelease, as Changesets marks it.
              prerelease=""
              case "$version" in *-*) prerelease="--prerelease" ;; esac
              # shellcheck disable=SC2086 # empty, or the one flag
              gh release create "$tag" --verify-tag --title "$tag" --notes "$notes" $prerelease
            done
